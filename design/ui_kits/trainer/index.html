<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwimCRM · Trener</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../shared/kit.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react" src="../../assets/icons.jsx"></script>
<script type="text/babel" data-presets="react" src="./data.jsx"></script>
<script type="text/babel" data-presets="react" src="./screens.jsx"></script>
<script type="text/babel" data-presets="react">
const { SidebarNav, Avatar, IconButton } = window.SwimCRMDesignSystem_546643;
const I = window.SwimIcons;
const S = window.TrainerScreens;
const TITLE = { sessions: 'Moje zajęcia', session: 'Frekwencja', groups: 'Moje grupy' };

function App() {
  const [view, setView] = React.useState('sessions');
  const NAV = [
    { key: 'sessions', label: 'Moje zajęcia', icon: <I.Calendar size={17} />, section: '' },
    { key: 'session', label: 'Frekwencja', icon: <I.Check size={17} />, section: '' },
    { key: 'groups', label: 'Moje grupy', icon: <I.Waves size={17} />, section: '' },
  ];
  const map = { sessions: S.Sessions, session: S.Session, groups: S.Groups };
  const Screen = map[view];
  return (
    <div className="app">
      <SidebarNav items={NAV} active={view} onSelect={setView} brand="H2O" product="SwimCRM" roleLabel="Trener"
        footer={<div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
          <Avatar name="Marek Zieliński" size={30} kind="t" />
          <div style={{ flex: 1, minWidth: 0, lineHeight: 1.2 }}><div className="strong" style={{ fontSize: 'var(--fs-xs)' }}>Marek Zieliński</div><div className="muted" style={{ fontSize: 'var(--fs-2xs)' }}>Trener</div></div>
          <IconButton label="Wyloguj"><I.Logout size={16} /></IconButton>
        </div>} />
      <div className="main">
        <header className="topbar"><h1>{TITLE[view]}</h1><span className="spacer" /><IconButton label="Powiadomienia"><I.Bell size={18} /></IconButton></header>
        <div className="scroll"><Screen go={setView} /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
