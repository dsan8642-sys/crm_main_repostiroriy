<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { SidebarNav, Tabs } = window.SwimCRMDesignSystem_546643;

const Home = I("M4 11l8-6 8 6M6 10v9h12v-9");
const Users = I("M16 18v-1a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v1M10 10a3 3 0 100-6 3 3 0 000 6M18 9a2.5 2.5 0 100-5");
