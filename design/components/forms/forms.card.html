<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Buttons, inputs, selects, choice controls & toggles" -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .sep { height: 1px; background: var(--border-subtle); margin: 4px 0 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Button, IconButton, Input, Select, Textarea, Checkbox, Radio, Switch } = window.SwimCRMDesignSystem_546643;
const Plus = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const Pencil = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/></svg>;
const Trash = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5h6v2M7 7l1 12h8l1-12" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>;

function Demo() {
  const [chk, setChk] = React.useState(true);
  const [rad, setRad] = React.useState('present');
  const [sw, setSw] = React.useState(true);
  return (
    <div>
      <div className="row">
        <Button variant="primary" iconLeft={<Plus/>}>Nowy klient</Button>
        <Button variant="secondary">Anuluj</Button>
        <Button variant="subtle">Filtruj</Button>
        <Button variant="ghost">Więcej</Button>
        <Button variant="danger" iconLeft={<Trash/>}>Usuń</Button>
        <Button variant="primary" loading>Zapisywanie</Button>
        <Button variant="secondary" disabled>Wyłączony</Button>
      </div>
      <div className="row">
        <Button size="sm" variant="secondary">sm</Button>
        <Button size="md" variant="secondary">md</Button>
        <Button size="lg" variant="secondary">lg</Button>
        <IconButton label="Edytuj"><Pencil/></IconButton>
        <IconButton label="Usuń" variant="danger"><Trash/></IconButton>
      </div>
      <div className="sep"></div>
      <div className="grid">
        <Input label="Imię dziecka" defaultValue="Zofia" />
        <Input label="Telefon rodziny" prefix="+48" defaultValue="600 100 200" />
        <Input label="Kwota" suffix="zł" defaultValue="240,00" size="md" />
        <Select label="Grupa" defaultValue="d"><option value="d">Delfiny</option><option>Rekiny</option></Select>
        <Input label="Email" error="Nieprawidłowy adres" defaultValue="rodzic@" />
        <Textarea label="Komentarz" rows={2} defaultValue="Alergia na chlor — łagodna." containerStyle={{gridColumn:'span 1'}} />
      </div>
      <div className="row">
        <Checkbox label="Zaznacz wszystkich" checked={chk} onChange={() => setChk(!chk)} />
        <Radio name="s" label="Obecny" checked={rad==='present'} onChange={() => setRad('present')} />
        <Radio name="s" label="Nieobecny" checked={rad==='absent'} onChange={() => setRad('absent')} />
        <Switch label="Powiadomienia SMS" checked={sw} onChange={() => setSw(!sw)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
