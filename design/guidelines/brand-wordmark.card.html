<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="Type-only brand lockup — no official logo was provided" -->
<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:0;background:var(--surface-card);font-family:var(--font-sans);}
  .wrap{display:flex;height:180px;}
  .half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
  .dark{background:var(--surface-inverse);}
  .lock{display:inline-flex;align-items:center;gap:11px;}
  .tile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-md);background:var(--primary);color:#fff;font-weight:700;font-size:16px;letter-spacing:-.03em;}
  .name{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--text-strong);}
  .name .sub{font-weight:400;color:var(--text-muted);}
  .name.on-dark{color:#fff;}
  .name.on-dark .sub{color:var(--slate-400);}
  .cap{font-size:11px;color:var(--text-faint);}
</style></head>
<body>
  <div class="wrap">
    <div class="half">
      <div class="lock"><span class="tile">H2O</span><span class="name">Swim<span class="sub">CRM</span></span></div>
      <span class="cap">Podstawowy · na jasnym tle</span>
    </div>
    <div class="half dark">
      <div class="lock"><span class="tile">H2O</span><span class="name on-dark">Swim<span class="sub">CRM</span></span></div>
      <span class="cap" style="color:var(--slate-400)">Odwrócony · na ciemnym tle</span>
    </div>
  </div>
</body></html>
