<!-- @dsCard group="Type" viewport="700x210" name="Type scale" subtitle="IBM Plex Sans — page title to caption" -->
<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:18px;background:var(--surface-card);color:var(--text-strong);}
  .r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--border-subtle);}
  .r:last-child{border-bottom:none;}
  .tok{width:120px;flex-shrink:0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
</style></head>
<body>
  <div class="r"><span class="tok">2xl · 25/600</span><span style="font-size:var(--fs-2xl);font-weight:600;letter-spacing:-.01em">Tytuł strony</span></div>
  <div class="r"><span class="tok">xl · 20/600</span><span style="font-size:var(--fs-xl);font-weight:600">Nagłówek sekcji</span></div>
  <div class="r"><span class="tok">lg · 17/600</span><span style="font-size:var(--fs-lg);font-weight:600">Tytuł karty</span></div>
  <div class="r"><span class="tok">base · 14/400</span><span style="font-size:var(--fs-base)">Tekst podstawowy interfejsu i tabel</span></div>
  <div class="r"><span class="tok">sm · 13/500</span><span style="font-size:var(--fs-sm);font-weight:500">Etykieta / kontrolka</span></div>
  <div class="r"><span class="tok">xs · 12/400</span><span style="font-size:var(--fs-xs);color:var(--text-muted)">Podpis, meta w tabeli</span></div>
</body></html>
