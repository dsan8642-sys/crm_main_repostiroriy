<!-- @dsCard group="Type" viewport="700x160" name="Numeric — IBM Plex Mono" subtitle="Tabular figures for money, counts & IDs" -->
<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:18px;background:var(--surface-card);color:var(--text-strong);}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 4px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .stack{display:flex;flex-direction:column;gap:3px;}
</style></head>
<body>
  <div class="grid">
    <div class="stack">
      <p class="lbl">Kwoty PLN</p>
      <span class="mono" style="font-size:26px;font-weight:600">240,00&nbsp;zł</span>
      <span class="mono" style="font-size:15px;color:var(--money-debt)">−80,00&nbsp;zł</span>
      <span class="mono" style="font-size:15px;color:var(--money-credit)">+120,00&nbsp;zł</span>
    </div>
    <div class="stack">
      <p class="lbl">Liczniki</p>
      <span class="mono" style="font-size:26px;font-weight:600">128</span>
      <span class="mono" style="font-size:15px;color:var(--text-muted)">−1  ·  +8  ·  +1</span>
      <span class="mono" style="font-size:15px;color:var(--text-muted)">4 / 12 zajęć</span>
    </div>
    <div class="stack">
      <p class="lbl">Data · ID</p>
      <span class="mono" style="font-size:15px">03.07.2026 17:00</span>
      <span class="mono" style="font-size:15px;color:var(--text-muted)">#PAY-2041</span>
      <span class="mono" style="font-size:15px;color:var(--text-muted)">+48 600 100 200</span>
    </div>
  </div>
</body></html>
