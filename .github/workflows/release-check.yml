name: Release check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean source tree
        shell: pwsh
        run: .\scripts\verify-release-tree.ps1 -Strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release source manifests
        run: python scripts/verify_release_source_manifests.py --require-tracked

      - name: Build release source archive
        shell: pwsh
        run: .\scripts\build-release-source.ps1

      - name: Verify release source archive
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short=12 HEAD).Trim()
          .\scripts\verify-release-source-archive.ps1 "releases\swimcrm-release-$shortSha.manifest.json"

      - name: Upload verified release source archive
        uses: actions/upload-artifact@v4
        with:
          name: swimcrm-release-source-${{ github.sha }}
          path: |
            releases/swimcrm-release-*.zip
            releases/swimcrm-release-*.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m venv swimcrm\.venv
          swimcrm\.venv\Scripts\python.exe -m pip install --upgrade pip
          swimcrm\.venv\Scripts\python.exe -m pip install -r swimcrm\requirements.txt

      - name: Full-stack release check
        shell: pwsh
        run: .\scripts\release-check-full.ps1

  postgres-backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swimcrm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swimcrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: swimcrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release source manifests
        run: python scripts/verify_release_source_manifests.py --require-tracked

      - name: Install backend dependencies
        run: |
          python -m venv swimcrm/.venv
          swimcrm/.venv/bin/python -m pip install --upgrade pip
          swimcrm/.venv/bin/python -m pip install -r swimcrm/requirements.txt

      - name: PostgreSQL backend tests
        working-directory: swimcrm
        run: .venv/bin/python manage.py test tests --noinput
